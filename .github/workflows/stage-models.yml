name: Stage verified models
on: workflow_dispatch
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify and upload pinned models
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r file url sha; do
            curl --fail --location --silent --show-error --retry 2 --output "$RUNNER_TEMP/$file" "$url"
            printf '%s  %s\n' "$sha" "$RUNNER_TEMP/$file" | sha256sum --check -
            gh release upload staging-20261010 "$RUNNER_TEMP/$file"
            rm "$RUNNER_TEMP/$file"
          done < <(jq -r '.assets[] | [.file, .source_url, .sha256] | @tsv' provenance.json)
